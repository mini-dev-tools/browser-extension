<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Blocked</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        
        .blocked-url {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.75rem;
            border-radius: 10px;
            margin: 1.5rem 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9rem;
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }
        
        .btn-primary {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        
        .btn-primary:hover {
            background: white;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .btn-secondary:hover {
            border-color: white;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .stats {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🛡️</div>
        <h1>Website Blocked</h1>
        <p>This website has been blocked to help you stay focused and productive.</p>
        
        <div class="blocked-url" id="blocked-url">
            <!-- URL will be inserted here -->
        </div>
        
        <div class="actions">
            <button class="btn-primary" onclick="goBack()">Go Back</button>
            <button class="btn-secondary" onclick="openSettings()">Manage Settings</button>
        </div>
        
        <div class="stats">
            <p>Blocking has saved you time today! 🎯</p>
        </div>
    </div>

    <script>
        // Get blocked URL from query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const blockedUrl = urlParams.get('url');
        
        if (blockedUrl) {
            document.getElementById('blocked-url').textContent = blockedUrl;
        }
        
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                // No history available - stay on current page
                alert('No previous page to go back to. Use the address bar to navigate.');
            }
        }
        
        function openSettings() {
            // Open the extension popup or settings
            chrome.runtime.openOptionsPage();
        }
    </script>
</body>
</html>
